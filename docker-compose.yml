version: "2.4"

services:
  # ─────────────────────────────────────────────────────────────
  # Python 后端（FastAPI）—— 业务与 AI 能力都在这里
  # 仅容器内网可达，由前端代理转发，不暴露到宿主机
  # ─────────────────────────────────────────────────────────────
  backend:
    # 默认使用 GitHub Actions 构建并推送的镜像（build-docker.yml，双架构 amd64/arm64）
    # 想本地构建：docker compose build backend（compose 会忽略 image 标签用 build 上下文重建）
    image: ghcr.io/shuzhenghong/wrong-notebook-backend:latest
    build:
      context: ./python-backend
    container_name: wrong-notebook-backend
    restart: unless-stopped
    expose:
      - "8000"          # 只对同网络的前端可见；不要改成 ports 暴露到公网
    environment:
      # 生产模式：debug=false 会强制校验 JWT_SECRET_KEY 不是默认值
      - DEBUG=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Please set JWT_SECRET_KEY in .env file}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
      - DATABASE_URL=sqlite:////app/data/wrong_notebook.db
      - UPLOAD_DIR=/app/data/uploads
      - APP_CONFIG_FILE=/app/data/app-config.json
      # 信任前端注入的 X-Forwarded-User（内网桥接）。
      # 安全前提：本服务未暴露到公网。若你把 8000 映射出去，此项必须设为 false 并改用 JWT。
      - TRUST_X_FORWARDED_USER=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # AI（可选，留空则关闭 AI 讲解功能）
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      # ── AI 成本控制（详见 python-backend/.env.example）──
      # OCR 文本直通：有本地 OCR 文字就别再发图片，图片 token 归零
      - AI_OCR_TEXT_MODE=${AI_OCR_TEXT_MODE:-auto}
      - AI_OCR_TEXT_MIN_CHARS=${AI_OCR_TEXT_MIN_CHARS:-80}
      # Gemini 2.5 思考链预算：0 = 关闭（结构化抽取不需要推理链）
      - GEMINI_THINKING_BUDGET=${GEMINI_THINKING_BUDGET:-0}
      # 分析结果缓存：重复请求零 token
      - AI_CACHE_ENABLED=${AI_CACHE_ENABLED:-true}
      - AI_CACHE_TTL_SEC=${AI_CACHE_TTL_SEC:-900}
      - AI_CACHE_MAX_ENTRIES=${AI_CACHE_MAX_ENTRIES:-256}
    volumes:
      - ./data/backend:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # Next.js 前端 —— 用户唯一访问的入口（:3000）
  # /api/* 由 catch-all 转发到 backend:8000
  # ─────────────────────────────────────────────────────────────
  frontend:
    # 默认使用 GitHub Actions 构建并推送的镜像（build-docker.yml，双架构 amd64/arm64）
    # 想本地构建：docker compose build frontend
    image: ghcr.io/shuzhenghong/wrong-notebook:latest
    build:
      context: .
    container_name: wrong-notebook
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # ── 关键：打通前端 → Python 后端 ──
      - PYTHON_BACKEND_URL=http://backend:8000
      - PYTHON_PROXY_ENABLED=true
      # ── 前端自身（NextAuth / 管理员初始化）──
      # 可留空 —— 首次启动自动生成强随机密钥并保存到 ./data/.nextauth_secret
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - AUTH_TRUST_HOST=true
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@localhost}
      # 可留空 —— 留空时自动生成强随机密码并打印在启动日志 + ./data/initial-admin-credentials.txt
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - ADMIN_CREDENTIALS_FILE=${ADMIN_CREDENTIALS_FILE:-/app/data/initial-admin-credentials.txt}
      # 说明：AI 与 OCR 均已下沉到 backend 服务，AI 配置见 backend 的环境变量，
      # 前端不需要（也不读取）任何 AI 相关变量。
    volumes:
      - ./data:/app/data
      - ./config:/app/config

#（已移除原有的 lw.PPOCR.OpenCVDNN sidecar：本地 OCR 现在由 backend 内置的
#  rapidocr + onnxruntime 承担，不需要额外容器。参见 python-backend/requirements-ocr.txt）
