version: '3'

services:
  wrong-notebook:
    image: ghcr.io/shuzhenghong/wrong-notebook:latest
    container_name: wrong-notebook
    restart: always
    ports:
      - "3000:3000"
    environment:
      # NEXTAUTH_URL 根据实际情况设置你的信息
      #- NEXTAUTH_URL=http://your_domain_name:3000
      # 必须是随机强密钥：openssl rand -base64 32
      # 启动脚本会校验，占位值 / 空值 / 少于 16 位都会拒绝启动
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?请在 .env 中设置 NEXTAUTH_SECRET}
      # 首次启动用于创建管理员账号（登录后会被强制要求修改密码）
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?请在 .env 中设置 DEFAULT_ADMIN_PASSWORD}
      # 本地 OCR：默认使用内置引擎（PP-OCRv4 中文模型，进程内推理，无需额外部署）。
      # 如需切换独立 sidecar 服务（C++ 推理更快），用 `docker compose --profile ocr up -d`
      # 启动 ocr 服务，并在 .env 中设置 OCR_BASE_URL=http://ocr:8787
      - OCR_BASE_URL=${OCR_BASE_URL:-}
      - OCR_API_KEY=${OCR_API_KEY:-}
      - OCR_TIMEOUT_MS=${OCR_TIMEOUT_MS:-}
    volumes:
      # Persist the SQLite database
      - ./data:/app/data
      - ./config:/app/config

  # 可选：独立本地 OCR 服务（lw.PPOCR.OpenCVDNN，PP-OCR Tiny，OpenCV DNN 纯 CPU，约 150MB 内存）
  # 默认不启动；需要时：docker compose --profile ocr up -d 并设置 OCR_BASE_URL=http://ocr:8787
  # 文档：https://github.com/lxw112190/lw.PPOCR.OpenCVDNN
  ocr:
    image: ghcr.io/lxw112190/lw.ppocr.opencvdnn:1.1.0
    container_name: wrong-notebook-ocr
    restart: unless-stopped
    profiles: ["ocr"]
    volumes:
      - ./data/ocr-logs:/data/logs
