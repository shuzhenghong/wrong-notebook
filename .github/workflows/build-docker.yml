name: Docker Build & Publish

# 触发方式：
#   1) GitHub 网页 Actions → 本工作流 → Run workflow（可选分支 + 自定义 tag）
#   2) 推送到 main 分支时自动构建
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '额外附加的自定义镜像标签（如 v1.2.3；留空则只推 latest + sha-<commit>）'
        required: false
        default: ''
      build_backend:
        description: '是否构建 Python 后端镜像'
        required: false
        type: boolean
        default: true
      build_frontend:
        description: '是否构建 Next.js 前端镜像'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # 前端 + 后端两个镜像并行构建；fail-fast=false 保证互不拖累
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            suffix: ''
            dockerhub_repo: wrong-notebook
          - name: backend
            context: ./python-backend
            suffix: -backend
            dockerhub_repo: wrong-notebook-backend

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 手动触发时允许单独跳过某一项（push 触发时 inputs 为空，默认全部构建）
      - name: Skip check
        id: skip
        run: |
          name="${{ matrix.name }}"
          skip=false
          # 只有手动触发时才读 inputs（push 触发时 inputs 为空，默认全量构建）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$name" = "frontend" ] && [ "${{ inputs.build_frontend }}" = "false" ]; then
              skip=true
            fi
            if [ "$name" = "backend" ] && [ "${{ inputs.build_backend }}" = "false" ]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "$name skip=$skip"

      - name: Checkout repository
        if: steps.skip.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.skip.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image list
        if: steps.skip.outputs.skip == 'false'
        id: images
        run: |
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${GITHUB_REPOSITORY}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "docker.io/${DOCKERHUB_USERNAME}/${{ matrix.dockerhub_repo }}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.skip.outputs.skip == 'false' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.skip.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push ${{ matrix.name }} image
        if: steps.skip.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 每个镜像用独立缓存作用域，避免前后端互相污染
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
